# Bienes Mützenparadies – Caddy-Konfiguration (Vorlage, Platzhalter setzt deploy/setup.sh).
# Caddy holt das HTTPS-Zertifikat selbst. Zugriffsprotokolle schreibt Caddy ohne "log"-Anweisung nicht.
@DOMAIN@ {
	encode zstd gzip
	request_body {
		max_size 12MB
	}
	header Strict-Transport-Security "max-age=31536000"
	reverse_proxy 127.0.0.1:@PORT@ {
		header_up X-Real-IP {remote_host}
	}
}

www.@DOMAIN@ {
	redir https://@DOMAIN@{uri} permanent
}
