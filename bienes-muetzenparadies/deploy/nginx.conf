# Bienes Mützenparadies – Nginx-Konfiguration (Vorlage, Platzhalter setzt deploy/setup.sh)

# Zugriffsprotokoll nur mit gekürzter IP-Adresse (siehe Datenschutzerklärung)
map $remote_addr $bm_ip_anon {
    ~^(?P<v4>\d+\.\d+\.\d+)\.\d+$          $v4.0;
    ~^(?P<v6>[0-9a-fA-F]*:[0-9a-fA-F]*):   $v6::;
    default                                0.0.0.0;
}
log_format bm_anon '$bm_ip_anon - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

# Bremse für den Verwaltungsbereich
limit_req_zone $binary_remote_addr zone=bm_admin:1m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name www.@DOMAIN@;
    access_log off;
    return 301 https://@DOMAIN@$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;

    access_log @LOG_DIR@/access.log bm_anon;
    error_log  @LOG_DIR@/error.log warn;

    client_max_body_size 12m;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /admin {
        limit_req zone=bm_admin burst=30 nodelay;
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
