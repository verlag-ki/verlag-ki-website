# Bines Mützenparadies – Nginx-Konfiguration (Vorlage, Platzhalter setzt deploy/setup.sh)

# Bremse für den Verwaltungsbereich
limit_req_zone $binary_remote_addr zone=bm_admin:1m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name www.@DOMAIN@;
    access_log off;
    return 301 https://@DOMAIN@$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;

    # Keine Zugriffsprotokolle (siehe Datenschutzerklärung), nur Fehlerprotokoll
    access_log off;
    error_log  @LOG_DIR@/error.log warn;

    client_max_body_size 12m;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /admin {
        limit_req zone=bm_admin burst=30 nodelay;
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
